name: Build Free Fire Special OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y genisoimage squashfs-tools libarchive-tools dosfstools p7zip-full   
      - name: Download Drock OS 3X 32-bit (MJ Edition)
        run: |
          wget --no-check-certificate \
            -O /tmp/drockos.7z \
            "https://download1327.mediafire.com/g3kja9qoltggNO936CCS3eycHYwxPYr1XjKQAVDysjt73IJ0GX2ZSY1_RvEbfby14N0AmcM3m3fhicAkQ6RN45K98vr0iSAlObmUurczI7g_IIoLrT0Z42ATOp82njkQ66ka7KHyiLnZp6pakdFW0IBadD3WGVBARghh3cq9Q7SqeA/qx2k5mpbvm39681/DROCKOS_3X_32BIT_MICHAEL_JACKSON_VERSION_X86-Without-Gearlock.7z"
          ls -lh /tmp/drockos.7z

      - name: Download Free Fire APK
        run: |
          wget --no-check-certificate \
            -O /tmp/FreeFire.apk \
            "https://apk.freefire24.com/apk"
          ls -lh /tmp/FreeFire.apk

      - name: Extract 7z
        run: |
          mkdir -p /tmp/nr/iso
          7z x /tmp/drockos.7z -o/tmp/nr/iso -y
          echo "=== Extracted files ==="
          ls -la /tmp/nr/iso/

      - name: Debug - What is in iso folder
        run: |
          echo "=== Files in /tmp/nr/iso ==="
          find /tmp/nr/iso -type f 2>/dev/null | head -30
          echo "=== All files recursively ==="
          find /tmp/nr/iso -name "*.cfg" 2>/dev/null
          find /tmp/nr/iso -name "isolinux*" 2>/dev/null
          echo "=== Directory structure ==="
          ls -la /tmp/nr/iso/   

       
      - name: Fix GMA 4500MHD + Desktop Crash
        run: |
          if [ -f /tmp/nr/iso/isolinux/isolinux.cfg ]; then
            CFG="/tmp/nr/iso/isolinux/isolinux.cfg"
          elif [ -f /tmp/nr/iso/boot/grub/grub.cfg ]; then
            CFG="/tmp/nr/iso/boot/grub/grub.cfg"
          else
            echo "Searching for config..."
            find /tmp/nr/iso -name "*.cfg" -o -name "grub*"
            exit 1
          fi

          echo "=== Original config ==="
          cat "$CFG"

          sed -i 's/quiet/nomodeset xforcevesa quiet/g' "$CFG"
          sed -i 's/MENU LABEL.*/MENU LABEL Free Fire Special OS - Made by ABDUL REHMAN FAROOQI/g' "$CFG"
          sed -i 's/MENU TITLE.*/MENU TITLE Free Fire Special OS v1.0 - Made by ABDUL REHMAN FAROOQI/g' "$CFG"

          echo "=== Modified config ==="
          cat "$CFG"

      - name: Replace boot logo
        run: |
          if [ -f assets/infinix-logo.bmp ]; then
            cp assets/infinix-logo.bmp /tmp/nr/iso/isolinux/ 2>/dev/null || \
            cp assets/infinix-logo.bmp /tmp/nr/iso/boot/grub/ 2>/dev/null || \
            echo "WARNING: Logo not placed"
          else
            echo "WARNING: assets/infinix-logo.bmp not found"
          fi

      - name: Extract system.sfs
        run: |
          cd /tmp/nr/iso
          if [ -f system.sfs ]; then
            unsquashfs -d /tmp/nr/squashfs-root system.sfs
          elif [ -f system.img ]; then
            sudo losetup -f system.img
            sudo mount -o loop /dev/loop0 /mnt
            mkdir -p /tmp/nr/squashfs-root
            cp -a /mnt/* /tmp/nr/squashfs-root/
            sudo umount /mnt
            sudo losetup -d /dev/loop0
          else
            echo "ERROR: system.sfs/system.img not found!"
            ls -la /tmp/nr/iso/
            exit 1
          fi

      - name: Fix desktop crash (build.prop)
        run: |
          BUILD_PROP="/tmp/nr/squashfs-root/system/build.prop"
          if [ -f "$BUILD_PROP" ]; then
            echo "ro.hwui.renderer=skia" >> "$BUILD_PROP"
            echo "ro.kernel.android.checkjni=0" >> "$BUILD_PROP"
            echo "build.prop updated"
          else
            echo "Searching..."
            find /tmp/nr/squashfs-root -name "build.prop"
          fi

      - name: Install Free Fire APK
        run: |
          mkdir -p /tmp/nr/squashfs-root/system/app/
          cp /tmp/FreeFire.apk /tmp/nr/squashfs-root/system/app/
          chmod 644 /tmp/nr/squashfs-root/system/app/FreeFire.apk
          echo "Free Fire installed"

      - name: Repack system.sfs
        run: |
          cd /tmp/nr
          if [ -f /tmp/nr/iso/system.sfs ]; then
            mksquashfs squashfs-root system.sfs -comp xz
            cp system.sfs /tmp/nr/iso/system.sfs
          else
            dd if=/dev/zero of=system.img bs=1M size=2048
            sudo mkfs.ext4 system.img
            sudo losetup -f system.img
            sudo mount -o loop /dev/loop0 /mnt
            cp -a squashfs-root/* /mnt/
            sudo umount /mnt
            sudo losetup -d /dev/loop0
            cp system.img /tmp/nr/iso/system.img
          fi

      - name: Build final ISO
        run: |
          cd /tmp/nr/iso
          if [ -f isolinux/isolinux.bin ]; then
            genisoimage -o "/tmp/FreeFire-Special-OS-v1.0.iso" \
              -b isolinux/isolinux.bin \
              -c isolinux/boot.cat \
              -no-emul-boot \
              -boot-load-size 4 \
              -boot-info-table \
              -V "FreeFire Special OS" \
              -J -R -O "FreeFire Special OS" \
              .
          else
            genisoimage -o "/tmp/FreeFire-Special-OS-v1.0.iso" \
              -b boot/grub/i386-pc/boot.hdd \
              -no-emul-boot \
              -boot-load-size 8 \
              -V "FreeFire Special OS" \
              -J -R -O "FreeFire Special OS" \
              .
          fi
          ls -lh /tmp/FreeFire-Special-OS-v1.0.iso

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire-Special-OS-v1.0
          path: /tmp/FreeFire-Special-OS-v1.0.iso   
