      - name: Extract GRUB config from ramdisk
        run: |
          mkdir -p /tmp/nr/ramdisk
          cd /tmp/nr/ramdisk
          zcat /tmp/nr/iso_extracted/ramdisk.img | cpio -idm 2>/dev/null || \
          cpio -idm < /tmp/nr/iso_extracted/ramdisk.img 2>/dev/null
          echo "=== Ramdisk contents ==="
          find /tmp/nr/ramdisk -type f | head -30

      - name: Fix GMA 4500MHD + Desktop Crash
        run: |
          CFG=$(find /tmp/nr/ramdisk -name "grub.cfg" -o -name "menu.lst" -o -name "*.cfg" 2>/dev/null | head -1)
          if [ -z "$CFG" ]; then
          echo "No .cfg found, checking all files:"
          find /tmp/nr/ramdisk -type f
          exit 1
          fi
          echo "Found: $CFG"
          echo "=== Original ==="
          cat "$CFG"

          # Kernel params add karo (GRUB format mein "linux" line hoti hai)
          sed -i 's/quiet/nomodeset xforcevesa quiet/g' "$CFG"
          sed -i 's/MENU LABEL.*/MENU LABEL Free Fire Special OS - Made by ABDUL REHMAN FAROOQI/g' "$CFG"
          sed -i 's/MENU TITLE.*/MENU TITLE Free Fire Special OS v1.0 - Made by ABDUL REHMAN FAROOQI/g' "$CFG"

          echo "=== Modified ==="
          cat "$CFG"

          - name: Repack ramdisk.img
           run: |
           cd /tmp/nr/ramdisk
           find . | cpio -H newc -o | gzip > /tmp/nr/iso_extracted/ramdisk.img
           echo "ramdisk.img repacked"

           - name: Extract system.img
             run: |
             sudo losetup -f /tmp/nr/iso_extracted/system.img
             LOOP=$(losetup -j /tmp/nr/iso_extracted/system.img | awk -F: '{print $1}')
             sudo mount -o loop "$LOOP" /mnt
             mkdir -p /tmp/nr/system-root
             cp -a /mnt/* /tmp/nr/system-root/
             sudo umount /mnt
             sudo losetup -d "$LOOP"
             echo "=== System contents ==="
             ls -la /tmp/nr/system-root/

             - name: Fix desktop crash (build.prop)
               run: |
               BUILD_PROP="/tmp/nr/system-root/build.prop"
               if [ ! -f "$BUILD_PROP" ]; then
               BUILD_PROP=$(find /tmp/nr/system-root -name "build.prop" | head -1)
             fi
             if [ -n "$BUILD_PROP" ] && [ -f "$BUILD_PROP" ]; then
             echo "ro.hwui.renderer=skia" >> "$BUILD_PROP"
             echo "ro.kernel.android.checkjni=0" >> "$BUILD_PROP"
             echo "build.prop updated: $BUILD_PROP"
          else
             echo "ERROR: build.prop not found!"
             find /tmp/nr/system-root -name "build.prop"
           fi

            - name: Install Free Fire APK
              run: |
              APP_DIR="/tmp/nr/system-root/app"
              if [ ! -d "$APP_DIR" ]; then
              APP_DIR=$(find /tmp/nr/system-root -type d -name "app" | head -1)
            fi
            mkdir -p "$APP_DIR"
            cp /tmp/FreeFire.apk "$APP_DIR/"
            chmod 644 "$APP_DIR/FreeFire.apk"
            echo "Free Fire installed in: $APP_DIR"

            - name: Repack system.img
              run: |
              # Original size preserve karo
              ORIG_SIZE=$(stat -c%s /tmp/nr/iso_extracted/system.img)
              sudo mkfs.ext4 /tmp/nr/iso_extracted/system.img
              sudo losetup -f /tmp/nr/iso_extracted/system.img
              LOOP=$(losetup -j /tmp/nr/iso_extracted/system.img | awk -F: '{print $1}')
              sudo mount -o loop "$LOOP" /mnt
              cp -a /tmp/nr/system-root/* /mnt/
              sudo umount /mnt
              sudo losetup -d "$LOOP"
              echo "system.img repacked"

            - name: Build final ISO
              run: |
              cd /tmp/nr/iso_extracted
              genisoimage -o "/tmp/FreeFire-Special-OS-v1.0.iso" \
              -b ramdisk.img \
              -no-emul-boot \
              -boot-load-size 8 \
              -V "FreeFire Special OS" \
              -J -R -O "FreeFire Special OS" \
           .
              ls -lh /tmp/FreeFire-Special-OS-v1.0.iso

           - name: Upload artifact
  uses: actions/upload-artifact@v4
  with:
    name: FreeFire-Special-OS-v1.0
    path: /tmp/FreeFire-Special-OS-v1.0.iso   
