name: Build Free Fire Special OS

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y p7zip-full xorriso cpio

      - name: Download Drock OS 7z
        run: |
          wget -O /tmp/drockos.7z "https://download1327.mediafire.com/9ikilu7eakmglX9FrQmMJttifVxkokxJmQONb88l3P88mU8nScPstxrgENuIvZ3tHyDB8S7fwxOxeMoiyWD0jJSEEhd1L6iXAT7i9zNnEL66jUPIv1CFapxlCJp4VneJMFRSUmtov_UGR8BulDcsWu33DDx1FGGGjmDbZkaujDig7Q/qx2k5mpbvm39681/DROCKOS_3X_32BIT_MICHAEL_JACKSON_VERSION_X86-Without-Gearlock.7z"
          ls -lh /tmp/drockos.7z

      - name: Download Free Fire APK
        run: |
          wget -O /tmp/FreeFire.apk "https://apk.freefire24.com/apk"
          ls -lh /tmp/FreeFire.apk

      - name: Extract 7z and find ISO
        run: |
          mkdir -p /tmp/nr/extracted
          7z x /tmp/drockos.7z -o/tmp/nr/extracted -y
          ISO_FILE=$(find /tmp/nr/extracted -name "*.iso" | head -1)
          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: No ISO found!"
            find /tmp/nr/extracted -type f | head -30
            exit 1
          fi
          cp "$ISO_FILE" /tmp/drockos.iso
          echo "ISO found"
          ls -lh /tmp/drockos.iso

      - name: Extract ramdisk.img
        run: |
          xorriso -osirrox on -indev /tmp/drockos.iso -extract /ramdisk.img /tmp/ramdisk.img
          ls -lh /tmp/ramdisk.img

      - name: Fix boot config
        run: |
          mkdir -p /tmp/nr/ramdisk
          cd /tmp/nr/ramdisk
          zcat /tmp/ramdisk.img | cpio -idm 2>/dev/null || cpio -idm < /tmp/ramdisk.img 2>/dev/null
          echo "=== Ramdisk files ==="
          find /tmp/nr/ramdisk -type f
          CFG=$(find /tmp/nr/ramdisk -name "*.cfg" -o -name "menu.lst" | head -1)
          if [ -n "$CFG" ]; then
            echo "=== Original ==="
            cat "$CFG"
            sed -i 's/quiet/nomodeset xforcevesa quiet/g' "$CFG"
            sed -i 's/MENU LABEL.*/MENU LABEL Free Fire Special OS - Made by ABDUL REHMAN FAROOQI/g' "$CFG"
            sed -i 's/MENU TITLE.*/MENU TITLE Free Fire Special OS v1.0 - Made by ABDUL REHMAN FAROOQI/g' "$CFG"
            echo "=== Modified ==="
            cat "$CFG"
          else
            echo "WARNING: No config in ramdisk"
          fi

      - name: Repack ramdisk.img
        run: |
          cd /tmp/nr/ramdisk
          find . | cpio -H newc -o 2>/dev/null | gzip > /tmp/new_ramdisk.img
          ls -lh /tmp/new_ramdisk.img

      - name: Modify system.img
        run: |
          xorriso -osirrox on -indev /tmp/drockos.iso -extract /system.img /tmp/system.img
          ls -lh /tmp/system.img
          sudo losetup -f /tmp/system.img
          LOOP=$(losetup -j /tmp/system.img | awk -F: '{print $1}')
          sudo mount -o loop,rw "$LOOP" /mnt
          echo "=== System root ==="
          ls /mnt/
          BUILD_PROP="/mnt/build.prop"
          if [ ! -f "$BUILD_PROP" ]; then
            BUILD_PROP=$(find /mnt -name "build.prop" | head -1)
          fi
          if [ -n "$BUILD_PROP" ]; then
            sudo chmod 644 "$BUILD_PROP"
            echo "ro.hwui.renderer=skia" | sudo tee -a "$BUILD_PROP"
            echo "ro.kernel.android.checkjni=0" | sudo tee -a "$BUILD_PROP"
            echo "build.prop updated"
          fi
          APP_DIR="/mnt/app"
          if [ ! -d "$APP_DIR" ]; then
            APP_DIR="/mnt/priv-app"
          fi
          mkdir -p "$APP_DIR"
          sudo cp /tmp/FreeFire.apk "$APP_DIR/"
          sudo chmod 644 "$APP_DIR/FreeFire.apk"
          echo "Free Fire installed"
          sudo umount /mnt
          sudo losetup -d "$LOOP"

      - name: Build final ISO
        run: |
          xorriso -indev /tmp/drockos.iso -update /tmp/system.img /system.img -update /tmp/new_ramdisk.img /ramdisk.img -outdev /tmp/FreeFire-Special-OS-v1.0.iso
          ls -lh /tmp/FreeFire-Special-OS-v1.0.iso   

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire-Special-OS-v1.0
          path: /tmp/FreeFire-Special-OS-v1.0.iso   
